
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PIANO</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #252535;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin: 25px 0 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1000px;
    margin: 15px auto;
    padding: 0 20px;
}

#info { font-size: 14px; }

button {
    background: #444455;
    color: #ff6666;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

button:hover { background: #666677; }

.metro { margin: 20px; }

.metro input {
    width: 65px;
    padding: 8px;
    text-align: center;
    font-size: 15px;
    border-radius: 5px;
    border: none;
}

#metroBtn { margin-left: 10px; }

.keyboard {
    position: relative;
    display: flex;
    justify-content: center;
    width: 900px;
    height: 210px;
    margin: 30px auto;
}

.white-key {
    position: relative;
    width: 75px;
    height: 200px;
    background: white;
    border: 1px solid black;
    border-radius: 0 0 5px 5px;
    color: black;
    cursor: pointer;
    flex-shrink: 0;
    user-select: none;
}

.white-key .key-label {
    margin-top: 25px;
    font-weight: bold;
    font-size: 15px;
}

.white-key .note-label {
    position: absolute;
    bottom: 30px;
    width: 100%;
    font-weight: bold;
}

.black-key {
    position: absolute;
    top: 0;
    width: 46px;
    height: 120px;
    background: black;
    border: 1px solid black;
    border-radius: 0 0 4px 4px;
    color: white;
    z-index: 2;
    cursor: pointer;
    user-select: none;
}

.black-key .key-label {
    margin-top: 20px;
    font-size: 11px;
    font-weight: bold;
}

.black-key .note-label {
    position: absolute;
    bottom: 25px;
    width: 100%;
    font-size: 12px;
    font-weight: bold;
}

.white-key.active { background: #ffee66; }
.black-key.active { background: #555555; }

@media (max-width: 950px) {
    .keyboard {
        transform: scale(0.8);
        transform-origin: top center;
    }
}
</style>
</head>

<body>

<h1>MY PIANO</h1>

<div class="top">
    <div id="info">鍵盤を押して演奏しよう！</div>

    <button id="instBtn" type="button">
        音色: ピアノ
    </button>
</div>

<div class="metro">
    BPM:
    <input type="number" id="tempo" value="120" min="1">

    <button id="metroBtn" type="button">
        メトロノーム: 停止
    </button>
</div>

<div class="keyboard" id="keyboard">

    <!-- 白鍵 -->
    <div class="white-key" data-code="KeyA">
        <div class="key-label">A</div>
        <div class="note-label">ソ</div>
    </div>

    <div class="white-key" data-code="KeyS">
        <div class="key-label">S</div>
        <div class="note-label">ラ</div>
    </div>

    <div class="white-key" data-code="KeyD">
        <div class="key-label">D</div>
        <div class="note-label">シ</div>
    </div>

    <div class="white-key" data-code="KeyF">
        <div class="key-label">F</div>
        <div class="note-label">ド</div>
    </div>

    <div class="white-key" data-code="KeyG">
        <div class="key-label">G</div>
        <div class="note-label">レ</div>
    </div>

    <div class="white-key" data-code="KeyH">
        <div class="key-label">H</div>
        <div class="note-label">ミ</div>
    </div>

    <div class="white-key" data-code="KeyJ">
        <div class="key-label">J</div>
        <div class="note-label">ファ</div>
    </div>

    <div class="white-key" data-code="KeyK">
        <div class="key-label">K</div>
        <div class="note-label">ソ</div>
    </div>

    <div class="white-key" data-code="KeyL">
        <div class="key-label">L</div>
        <div class="note-label">ラ</div>
    </div>

    <div class="white-key" data-code="Semicolon">
        <div class="key-label">;</div>
        <div class="note-label">シ</div>
    </div>

    <div class="white-key" data-code="Quote">
        <div class="key-label">:</div>
        <div class="note-label">ド</div>
    </div>

    <div class="white-key" data-code="Backslash">
        <div class="key-label">」</div>
        <div class="note-label">レ</div>
    </div>

    <!-- 黒鍵 -->
    <div class="black-key" data-code="KeyQ" style="left:52px">
        <div class="key-label">Q</div>
        <div class="note-label">ソ#</div>
    </div>

    <div class="black-key" data-code="KeyE" style="left:127px">
        <div class="key-label">E</div>
        <div class="note-label">ラ#</div>
    </div>

    <div class="black-key" data-code="KeyR" style="left:277px">
        <div class="key-label">R</div>
        <div class="note-label">ド#</div>
    </div>

    <div class="black-key" data-code="KeyT" style="left:352px">
        <div class="key-label">T</div>
        <div class="note-label">レ#</div>
    </div>

    <div class="black-key" data-code="KeyY" style="left:502px">
        <div class="key-label">Y</div>
        <div class="note-label">ファ#</div>
    </div>

    <div class="black-key" data-code="KeyU" style="left:577px">
        <div class="key-label">U</div>
        <div class="note-label">ソ#</div>
    </div>

    <div class="black-key" data-code="KeyI" style="left:652px">
        <div class="key-label">I</div>
        <div class="note-label">ラ#</div>
    </div>

    <div class="black-key" data-code="BracketRight" style="left:802px">
        <div class="key-label">「</div>
        <div class="note-label">ド#</div>
    </div>

</div>

<script>

// 音階と周波数
const notes = {
    KeyA: ["ソ", 196.00],
    KeyS: ["ラ", 220.00],
    KeyD: ["シ", 246.94],
    KeyF: ["ド", 261.63],
    KeyG: ["レ", 293.66],
    KeyH: ["ミ", 329.63],
    KeyJ: ["ファ", 349.23],
    KeyK: ["ソ", 392.00],
    KeyL: ["ラ", 440.00],
    Semicolon: ["シ", 493.88],
    Quote: ["ド", 523.25],
    Backslash: ["レ", 587.33],

    KeyQ: ["ソ#", 207.65],
    KeyE: ["ラ#", 233.08],
    KeyR: ["ド#", 277.18],
    KeyT: ["レ#", 311.13],
    KeyY: ["ファ#", 369.99],
    KeyU: ["ソ#", 415.30],
    KeyI: ["ラ#", 466.16],
    BracketRight: ["ド#", 554.37]
};

// 楽器設定
let currentInstrument = "piano";

const instrumentNames = {
    piano: "ピアノ",
    xylophone: "木琴",
    musicbox: "オルゴール"
};

// 音声エンジン
let audioContext = null;

// 音声エンジンを起動
async function ensureAudioReady() {

    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
        document.getElementById("info").textContent =
            "このブラウザは音声再生に対応していません。";
        return false;
    }

    if (!audioContext || audioContext.state === "closed") {
        audioContext = new AudioContextClass();
    }

    if (audioContext.state !== "running") {
        await audioContext.resume();
    }

    return audioContext.state === "running";
}

// 音を鳴らす
async function playSound(freq, instrument = currentInstrument) {

    const ready = await ensureAudioReady();

    if (!ready) return;

    const now = audioContext.currentTime;

    const duration =
        instrument === "metro" ? 0.15 : 0.65;

    const master = audioContext.createGain();

    master.gain.setValueAtTime(0.8, now);
    master.connect(audioContext.destination);

    function addOscillator(frequency, volume) {

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(frequency, now);

        gain.gain.setValueAtTime(volume, now);

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + duration
        );

        osc.connect(gain);
        gain.connect(master);

        osc.start(now);
        osc.stop(now + duration);
    }

    if (instrument === "metro") {

        addOscillator(1000, 0.5);

    } else if (instrument === "piano") {

        addOscillator(freq, 0.45);
        addOscillator(freq * 2, 0.12);
        addOscillator(freq * 3, 0.04);

    } else if (instrument === "xylophone") {

        addOscillator(freq, 0.4);
        addOscillator(freq * 3.2, 0.15);

    } else {

        addOscillator(freq, 0.4);
        addOscillator(freq * 4, 0.12);
        addOscillator(freq * 6, 0.06);

    }

    setTimeout(() => {
        master.disconnect();
    }, duration * 1000 + 100);
}

// 鍵盤を光らせる
function flashKey(code) {

    const element = document.querySelector(
        `[data-code="${code}"]`
    );

    if (!element) return;

    element.classList.add("active");

    setTimeout(() => {
        element.classList.remove("active");
    }, 150);
}

// 演奏処理
function pressKey(code) {

    if (!notes[code]) return;

    const [name, freq] = notes[code];

    document.getElementById("info").textContent =
        `[${instrumentNames[currentInstrument]}] ${name}`;

    playSound(freq);

    flashKey(code);
}

// キーボード操作
document.addEventListener("keydown", function(event) {

    if (event.repeat) return;

    if (notes[event.code]) {

        event.preventDefault();

        if (
            document.activeElement &&
            document.activeElement.tagName === "INPUT"
        ) {
            document.activeElement.blur();
        }

        pressKey(event.code);
    }

});

// マウス操作
document.querySelectorAll(".white-key, .black-key")
.forEach(element => {

    element.addEventListener("pointerdown", function() {

        pressKey(this.dataset.code);

    });

});

// 音色切り替え
document.getElementById("instBtn")
.addEventListener("click", function() {

    if (currentInstrument === "piano") {

        currentInstrument = "xylophone";

    } else if (currentInstrument === "xylophone") {

        currentInstrument = "musicbox";

    } else {

        currentInstrument = "piano";

    }

    this.textContent =
        "音色: " + instrumentNames[currentInstrument];

});

// メトロノーム
let metronomeRunning = false;
let metronomeTimer = null;

function metronomeLoop() {

    if (!metronomeRunning) return;

    let bpm = Number(
        document.getElementById("tempo").value
    );

    if (!Number.isFinite(bpm) || bpm <= 0) {
        bpm = 120;
    }

    playSound(0, "metro");

    metronomeTimer = setTimeout(
        metronomeLoop,
        60000 / bpm
    );
}

document.getElementById("metroBtn")
.addEventListener("click", function() {

    metronomeRunning = !metronomeRunning;

    if (metronomeRunning) {

        this.textContent = "メトロノーム: 再生中";
        this.style.color = "#44ff44";

        metronomeLoop();

    } else {

        clearTimeout(metronomeTimer);

        this.textContent = "メトロノーム: 停止";
        this.style.color = "#ff4444";

    }

});

</script>

</body>
</html>
