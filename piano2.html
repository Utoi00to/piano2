
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PIANO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #252535;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin: 25px 0 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1000px;
    margin: 15px auto;
    padding: 0 20px;
}

#info {
    font-size: 14px;
}

button {
    background: #444455;
    color: #ff6666;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #666677;
}

.metro {
    margin: 20px;
}

.metro input {
    width: 65px;
    padding: 8px;
    text-align: center;
    font-size: 15px;
    border-radius: 5px;
    border: none;
}

#metroBtn {
    margin-left: 10px;
}

/* 鍵盤全体 */
.keyboard-wrap {
    width: 100%;
    overflow-x: auto;
    padding: 0 10px;
}

.keyboard {
    position: relative;
    display: flex;
    justify-content: flex-start;
    width: 923px;
    height: 210px;
    margin: 30px auto;
}

/* 白鍵 */
.white-key {
    position: relative;
    width: 75px;
    height: 200px;
    background: white;
    border: 1px solid black;
    border-radius: 0 0 5px 5px;
    color: black;
    cursor: pointer;
    flex-shrink: 0;
    user-select: none;
}

.white-key .key-label {
    margin-top: 25px;
    font-weight: bold;
    font-size: 15px;
}

.white-key .note-label {
    position: absolute;
    bottom: 30px;
    width: 100%;
    font-weight: bold;
}

/* 黒鍵 */
.black-key {
    position: absolute;
    top: 0;
    width: 46px;
    height: 120px;
    background: black;
    border: 1px solid black;
    border-radius: 0 0 4px 4px;
    color: white;
    z-index: 2;
    cursor: pointer;
    user-select: none;
}

.black-key .key-label {
    margin-top: 20px;
    font-size: 11px;
    font-weight: bold;
}

.black-key .note-label {
    position: absolute;
    bottom: 25px;
    width: 100%;
    font-size: 12px;
    font-weight: bold;
}

.white-key.active {
    background: #ffee66;
}

.black-key.active {
    background: #555555;
}
</style>
</head>

<body>

<h1>MY PIANO</h1>

<div class="top">
    <div id="info">キーボードを押して演奏しよう！</div>

    <button id="instBtn" onclick="toggleInstrument()">
        音色: ピアノ
    </button>
</div>

<div class="metro">
    BPM:
    <input type="number" id="tempo" value="120" min="1">

    <button id="metroBtn" onclick="toggleMetronome()">
        メトロノーム: 停止
    </button>
</div>

<div class="keyboard-wrap">
<div class="keyboard" id="keyboard">

    <!-- 白鍵 -->

    <div class="white-key" data-code="KeyA">
        <div class="key-label">A</div>
        <div class="note-label">ソ</div>
    </div>

    <div class="white-key" data-code="KeyS">
        <div class="key-label">S</div>
        <div class="note-label">ラ</div>
    </div>

    <div class="white-key" data-code="KeyD">
        <div class="key-label">D</div>
        <div class="note-label">シ</div>
    </div>

    <div class="white-key" data-code="KeyF">
        <div class="key-label">F</div>
        <div class="note-label">ド</div>
    </div>

    <div class="white-key" data-code="KeyG">
        <div class="key-label">G</div>
        <div class="note-label">レ</div>
    </div>

    <div class="white-key" data-code="KeyH">
        <div class="key-label">H</div>
        <div class="note-label">ミ</div>
    </div>

    <div class="white-key" data-code="KeyJ">
        <div class="key-label">J</div>
        <div class="note-label">ファ</div>
    </div>

    <div class="white-key" data-code="KeyK">
        <div class="key-label">K</div>
        <div class="note-label">ソ</div>
    </div>

    <div class="white-key" data-code="KeyL">
        <div class="key-label">L</div>
        <div class="note-label">ラ</div>
    </div>

    <div class="white-key" data-code="Semicolon">
        <div class="key-label">;</div>
        <div class="note-label">シ</div>
    </div>

    <div class="white-key" data-code="Quote">
        <div class="key-label">:</div>
        <div class="note-label">ド</div>
    </div>

    <div class="white-key" data-code="Backslash">
        <div class="key-label">」</div>
        <div class="note-label">レ</div>
    </div>


    <!-- 黒鍵 -->

    <!-- 一番左のファ# -->
    <div class="black-key" data-code="KeyQ" style="left:0px">
        <div class="key-label">Q</div>
        <div class="note-label">ファ#</div>
    </div>

    <!-- ソ# -->
    <div class="black-key" data-code="KeyW" style="left:52px">
        <div class="key-label">W</div>
        <div class="note-label">ソ#</div>
    </div>

    <!-- ラ# -->
    <div class="black-key" data-code="KeyE" style="left:127px">
        <div class="key-label">E</div>
        <div class="note-label">ラ#</div>
    </div>

    <!-- ド# -->
    <div class="black-key" data-code="KeyT" style="left:277px">
        <div class="key-label">T</div>
        <div class="note-label">ド#</div>
    </div>

    <!-- レ# -->
    <div class="black-key" data-code="KeyY" style="left:352px">
        <div class="key-label">Y</div>
        <div class="note-label">レ#</div>
    </div>

    <!-- ファ# -->
    <div class="black-key" data-code="KeyI" style="left:502px">
        <div class="key-label">I</div>
        <div class="note-label">ファ#</div>
    </div>

    <!-- ソ# -->
    <div class="black-key" data-code="KeyO" style="left:577px">
        <div class="key-label">O</div>
        <div class="note-label">ソ#</div>
    </div>

    <!-- ラ# -->
    <div class="black-key" data-code="KeyP" style="left:652px">
        <div class="key-label">P</div>
        <div class="note-label">ラ#</div>
    </div>

    <!-- 右側のド# -->
    <div class="black-key" data-code="BracketLeft" style="left:802px">
        <div class="key-label">@</div>
        <div class="note-label">ド#</div>
    </div>

    <!-- 一番右のレ# -->
    <div class="black-key" data-code="BracketRight" style="left:877px">
        <div class="key-label">[</div>
        <div class="note-label">レ#</div>
    </div>

</div>
</div>


<script>

// 音階と周波数
const notes = {

    // 白鍵
    KeyA: ["ソ", 196.00],
    KeyS: ["ラ", 220.00],
    KeyD: ["シ", 246.94],
    KeyF: ["ド", 261.63],
    KeyG: ["レ", 293.66],
    KeyH: ["ミ", 329.63],
    KeyJ: ["ファ", 349.23],
    KeyK: ["ソ", 392.00],
    KeyL: ["ラ", 440.00],
    Semicolon: ["シ", 493.88],
    Quote: ["ド", 523.25],
    Backslash: ["レ", 587.33],

    // 黒鍵
    KeyQ: ["ファ#", 185.00],
    KeyW: ["ソ#", 207.65],
    KeyE: ["ラ#", 233.08],
    KeyT: ["ド#", 277.18],
    KeyY: ["レ#", 311.13],
    KeyI: ["ファ#", 369.99],
    KeyO: ["ソ#", 415.30],
    KeyP: ["ラ#", 466.16],
    BracketLeft: ["ド#", 554.37],
    BracketRight: ["レ#", 622.25]
};


// 楽器設定
let currentInstrument = "piano";

const instrumentNames = {
    piano: "ピアノ",
    xylophone: "木琴",
    musicbox: "オルゴール"
};


// 音声エンジン
const audioContext = new (
    window.AudioContext || window.webkitAudioContext
)();


// 音を鳴らす
function playSound(freq, instrument = currentInstrument) {

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    const now = audioContext.currentTime;
    const master = audioContext.createGain();

    master.connect(audioContext.destination);

    master.gain.setValueAtTime(0.3, now);

    let duration = 0.5;

    if (instrument === "metro") {
        duration = 0.15;
    }

    function addOscillator(frequency, volume) {

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.value = frequency;

        gain.gain.setValueAtTime(volume, now);

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + duration
        );

        osc.connect(gain);
        gain.connect(master);

        osc.start(now);
        osc.stop(now + duration);
    }

    if (instrument === "metro") {

        addOscillator(1000, 0.3);

    } else if (instrument === "piano") {

        addOscillator(freq, 0.2);
        addOscillator(freq * 2, 0.06);
        addOscillator(freq * 3, 0.02);

    } else if (instrument === "xylophone") {

        addOscillator(freq, 0.2);
        addOscillator(freq * 3.2, 0.1);

    } else {

        addOscillator(freq, 0.2);
        addOscillator(freq * 4, 0.08);
        addOscillator(freq * 6, 0.04);
    }
}


// 鍵盤を光らせる
function flashKey(code) {

    const element = document.querySelector(
        `[data-code="${code}"]`
    );

    if (!element) return;

    element.classList.add("active");

    setTimeout(() => {
        element.classList.remove("active");
    }, 150);
}


// 演奏処理
function pressKey(code) {

    if (!notes[code]) return;

    const [name, freq] = notes[code];

    document.getElementById("info").textContent =
        `[${instrumentNames[currentInstrument]}] ${name}`;

    playSound(freq);

    flashKey(code);
}


// キーボード操作
document.addEventListener("keydown", function(event) {

    if (event.repeat) return;

    if (notes[event.code]) {

        event.preventDefault();

        if (document.activeElement.tagName === "INPUT") {
            document.activeElement.blur();
        }

        pressKey(event.code);
    }

});


// マウス操作
document.querySelectorAll(".white-key, .black-key")
.forEach(element => {

    element.addEventListener("click", function() {
        pressKey(this.dataset.code);
    });

});


// 音色切り替え
function toggleInstrument() {

    if (currentInstrument === "piano") {

        currentInstrument = "xylophone";

    } else if (currentInstrument === "xylophone") {

        currentInstrument = "musicbox";

    } else {

        currentInstrument = "piano";
    }

    document.getElementById("instBtn").textContent =
        "音色: " + instrumentNames[currentInstrument];
}


// メトロノーム
let metronomeRunning = false;
let metronomeTimer = null;


function toggleMetronome() {

    const btn = document.getElementById("metroBtn");

    if (metronomeRunning) {

        metronomeRunning = false;

        clearTimeout(metronomeTimer);

        btn.textContent = "メトロノーム: 停止";
        btn.style.color = "#ff4444";

    } else {

        metronomeRunning = true;

        btn.textContent = "メトロノーム: 再生中";
        btn.style.color = "#44ff44";

        metronomeLoop();
    }
}


function metronomeLoop() {

    if (!metronomeRunning) return;

    let bpm = Number(
        document.getElementById("tempo").value
    );

    if (!Number.isFinite(bpm) || bpm <= 0) {
        bpm = 120;
    }

    playSound(0, "metro");

    metronomeTimer = setTimeout(
        metronomeLoop,
        60000 / bpm
    );
}

</script>

</body>
</html>
